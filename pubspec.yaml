name: hikmahplayer
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # ─── NAVIGATION ───
  go_router: ^14.2.0

  # ─── MEDIA PLAYBACK ───
  media_kit: ^1.1.10+1              # Cross-platform media engine (libmpv)
  media_kit_video: ^1.2.4           # Video rendering widget
  media_kit_libs_video: ^1.0.4      # Native libs (Android/iOS/Windows)
  just_audio: ^0.9.39               # Audio-only playback
  flutter_audio_waveforms: ^1.2.1   # Waveform visualization
  video_player: ^2.9.1              # Fallback for simpler platforms

  # ─── AUDIO SESSION ───
  audio_session: ^0.1.21            # Audio focus, interruptions
  audio_service: ^0.18.15           # Background audio + notifications
  flutter_local_notifications: ^17.2.3  # Local notifications (music, video, download, transfer)

  # ─── AI & ML (On-Device) ───
  # NOTE: tflite_flutter / google_mlkit_translation / whisper_ggml REMOVED —
  # none are imported by lib/ or test/ (the AI layer is engine-agnostic via
  # lib/core/services/ai_service.dart), and tflite_flutter ships TensorFlow
  # Lite AARs that all share the `org.tensorflow.lite` namespace, which AGP 9
  # rejects during the manifest merge. Re-add current versions with the engine
  # when the transcription/translation feature is implemented.

  # ─── VIDEO PROCESSING ───
  # NOTE: ffmpeg_kit_flutter REMOVED — its Maven artifacts
  # (com.arthenica:ffmpeg-kit-https:6.0-2) were deleted from Maven Central
  # (upstream retired), breaking the Gradle build. Exports now use the system
  # `ffmpeg` binary via ProcessExportBackend (lib/core/services/export_backend.dart).
  screenshot: ^3.0.0                # Frame capture

  # ─── SUBTITLE RENDERING ───
  subtitle_wrapper_package: ^2.2.1  # Advanced subtitle parsing & rendering

  # ─── STATE MANAGEMENT ───
  flutter_riverpod: ^2.5.1

  # ─── DATABASE ───
  drift: ^2.34.0                    # SQLite ORM (type-safe)
  sqlite3_flutter_libs: ^0.5.21     # SQLite native libs

  # ─── LOCAL STORAGE ───
  shared_preferences: ^2.2.3        # Key-value storage
  path_provider: ^2.1.4             # App directories
  path: ^1.9.0                      # Path manipulation

  # ─── PERMISSIONS ───
  permission_handler: ^11.3.1       # Runtime permissions

  # ─── SHARE / PICK ───
  # NOTE: on_audio_query (spec §5.3) is omitted — its 2.x android module ships
  # no namespace and AGP 9 no longer derives one from the manifest, so any
  # build fails at configuration time. Media scanning uses the LibraryService
  # + drift pipeline instead.
  # CAUTION: after adding/removing native plugins, run `flutter clean` and
  # delete android/.gradle before rebuilding — stale intermediates produce
  # phantom Kotlin/javac "cannot find symbol" failures.
  share_plus: ^13.0.0               # Share media files
  file_picker: ^12.0.0              # Pick files to play

  # ─── UI COMPONENTS ───
  google_fonts: ^6.2.1              # Custom typography
  flutter_svg: ^2.0.10+1            # SVG rendering
  lottie: ^3.1.2                    # Lottie animations (onboarding)
  cached_network_image: ^3.3.1      # Image caching
  shimmer: ^3.0.0                   # Loading placeholders
  flutter_staggered_grid_view: ^0.7.0  # Masonry grid (videos)
  sliver_tools: ^0.2.12             # Advanced slivers
  animations: ^2.0.11               # Material motion
  flutter_animate: ^4.5.0           # Animations
  flutter_slidable: ^3.1.0          # List actions
  photo_view: ^0.15.0               # Artwork zoom

  # ─── UTILITIES ───
  intl: ^0.20.2                     # Date/number formatting
  uuid: ^4.4.0                      # Unique IDs
  equatable: ^2.0.5                 # Value equality
  collection: ^1.18.0               # List utilities
  rxdart: ^0.27.7                   # Reactive streams
  logger: ^2.3.0                    # Pretty logging
  crypto: ^3.0.7                    # Content hashing & duplicate detection
  dio: ^5.4.0                       # HTTP client

  # ─── APP INFO ───
  package_info_plus: ^10.2.1        # App version / build number

  # ─── PLATFORM SPECIFIC ───
  wakelock_plus: ^1.2.5             # Keep screen on during playback
  screen_brightness: ^2.1.11        # Brightness control (gestures)
  volume_controller: ^3.6.0         # Volume control (gestures)
  dynamic_color: ^2.1.0             # Material You palettes
  hive_flutter: ^1.1.0              # Fast cache
  flutter_secure_storage: ^11.0.0   # Encrypted vault

  # ─── CONNECTIVITY & STREAMING ───
  web_socket_channel: ^3.0.0        # Real-time sync
  connectivity_plus: ^6.0.3         # Network state
  cast: ^2.1.0                      # Chromecast
  flutter_to_airplay: ^2.1.0        # AirPlay

  # ─── ACCESSIBILITY ───
  flutter_tts: ^4.0.0               # Text-to-speech

  # ─── PLATFORM DESKTOP ───
  pip: ^0.0.4                       # Picture-in-Picture mode
  window_manager: ^0.3.8            # Desktop window

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ─── CODE GENERATION ───
  build_runner: ^2.15.0
  drift_dev: ^2.34.0

  # NOTE: freezed / riverpod_generator / json_serializable were removed: the
  # app has no @freezed / @riverpod / @JsonSerializable annotations, and their
  # pinned analyzer ranges (<8.0.0) prevent build_runner from analyzing code
  # under the Dart 3.10+ language features used by the current SDK toolchain.
  # Re-add them (with matching annotation packages) if codegen models land.

  # ─── TESTING ───
  mocktail: ^1.0.3
  # NOTE: 'riverpod_test' (spec §5.4) is unresolvable under Flutter 3.44:
  # it pins 'test ^1.16' whose transitive constraints clash with the SDK's
  # locked test_api 0.7.11 and freezed's analyzer range. Providers are
  # tested directly via ProviderContainer instead.


  # ─── ICONS ───
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  # ─── ASSETS ───
  assets:
    - assets/images/splash/
    - assets/images/onboarding/
    - assets/images/empty_states/
    - assets/icons/

  # ─── FONTS ───
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

# ═══════════════════════════════════════════════════════════
#  LAUNCHER ICON CONFIG (uses Image 2)
# ═══════════════════════════════════════════════════════════
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"

  # Adaptive icon (Android 8+)
  adaptive_icon_background: "#0A0E27"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

  min_sdk_android: 24

  # Windows
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256

# ═══════════════════════════════════════════════════════════
#  NATIVE SPLASH CONFIG (uses splash logo)
# ═══════════════════════════════════════════════════════════
flutter_native_splash:
  color: "#0A0E27"                # Deep navy background
  image: assets/icons/splash_logo.png
  color_dark: "#0A0E27"
  image_dark: assets/icons/splash_logo.png

  android_12:
    color: "#0A0E27"
    color_dark: "#0A0E27"
    icon_background_color: "#0A0E27"
    icon_background_color_dark: "#0A0E27"
    image: assets/icons/splash_logo_android12.png
    image_dark: assets/icons/splash_logo_android12.png

  android: true
  ios: true
  web: false
